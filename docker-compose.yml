services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring_aloptama}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitoring_aloptama}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitoring_aloptama}
      CDP1_IP: ${CDP1_IP:-172.70.55.162}
      CDP1_MOUNT_PATH: ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}
      CDP2_IP: ${CDP2_IP:-172.70.55.163}
      CDP2_MOUNT_PATH: ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}
      # The API process runs migrations once, then serves HTTP. It does NOT
      # run backfill or the ingestion worker — those live in the dedicated
      # worker container so the API event loop never blocks on NFS/CDP I/O.
      ENABLE_BACKFILL_ON_BOOT: "false"
      ENABLE_MIGRATIONS_ON_BOOT: "true"
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}:/mnt/cdp1_logs
      - ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}:/mnt/cdp2_logs
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - monitoring-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-worker
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/code/docker/worker-entrypoint.sh"]
    # Worker is a background process (not an HTTP server); the image's
    # /health check does not apply. Report healthy while the process runs.
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitoring_aloptama}
      CDP1_IP: ${CDP1_IP:-172.70.55.162}
      CDP1_MOUNT_PATH: ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}
      CDP2_IP: ${CDP2_IP:-172.70.55.163}
      CDP2_MOUNT_PATH: ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}
      # CRITICAL: keep migrations OFF in the worker. The backend owns schema
      # migrations; running them from both processes causes advisory-lock /
      # deadlock races on boot. Backfill is also performed by the worker's
      # entrypoint explicitly (see worker-entrypoint.sh), never inline.
      ENABLE_BACKFILL_ON_BOOT: "false"
      ENABLE_MIGRATIONS_ON_BOOT: "false"
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}:/mnt/cdp1_logs
      - ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}:/mnt/cdp2_logs
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - monitoring-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      # Pin Traefik to the Coolify resource network so the Docker provider
      # uses the reachable ingress IP. Without this, the frontend's extra
      # compose network (monitoring-net) makes Traefik pick an unreachable
      # endpoint -> connection hang -> 504 Gateway Timeout.
      # NOTE: c7pv8707qeyc5vp23nzqgrsh is this app's stable Coolify resource
      # UUID (COOLIFY_RESOURCE_UUID). If the resource is recreated, update it.
      - "traefik.enable=true"
      - "traefik.docker.network=c7pv8707qeyc5vp23nzqgrsh"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  db-data:
    driver: local