services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring_aloptama}
    volumes:
      # Persist DB data ACROSS redeploys. Coolify does NOT keep compose
      # named volumes (its Storage UI says compose mounts are read-only),
      # so the DB volume was recreated empty on each deploy -> data wiped.
      # Use a HOST bind-mount to a fixed path that survives container
      # recreation. Override the path with PG_DATA_DIR if needed.
      - ${PG_DATA_DIR:-/var/lib/monitoring-aloptama-pg}:/var/lib/postgresql/data
    # expose:
    #   - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitoring_aloptama}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitoring_aloptama}
      CDP1_IP: ${CDP1_IP:-172.22.39.162}
      CDP1_MOUNT_PATH: ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}
      CDP2_IP: ${CDP2_IP:-172.22.39.163}
      CDP2_MOUNT_PATH: ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}
      ENABLE_BACKFILL_ON_BOOT: ${ENABLE_BACKFILL_ON_BOOT:-false}
      ENABLE_MIGRATIONS_ON_BOOT: "true"
      RESET_DB_ON_BOOT: ${RESET_DB_ON_BOOT:-false}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}:/mnt/cdp1_logs
      - ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}:/mnt/cdp2_logs
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-worker
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/code/docker/worker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitoring_aloptama}
      CDP1_IP: ${CDP1_IP:-172.22.39.162}
      CDP1_MOUNT_PATH: ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}
      CDP2_IP: ${CDP2_IP:-172.22.39.163}
      CDP2_MOUNT_PATH: ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}
      ENABLE_BACKFILL_ON_BOOT: ${ENABLE_BACKFILL_ON_BOOT:-false}
      ENABLE_MIGRATIONS_ON_BOOT: "false"
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - ${CDP1_MOUNT_PATH:-/mnt/cdp1_logs/}:/mnt/cdp1_logs
      - ${CDP2_MOUNT_PATH:-/mnt/cdp2_logs/}:/mnt/cdp2_logs
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

# NOTE: db-data named volume removed on purpose — see the db service above.
# (Coolify does not persist compose named volumes across deployments.)
